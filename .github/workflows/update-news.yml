name: Update company news

on:
  schedule:
    # Every 3 hours at :17 UTC; avoids GitHub Actions high-load top-of-hour delays.
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "news-ui.js"

permissions:
  contents: write

concurrency:
  group: ai-industry-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Google News RSS for 47 companies
        run: python scripts/update_news.py

      - name: Commit refreshed news file (only when changed)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh company news feed [skip ci]"
            git push origin HEAD:main
          else
            echo "No news changes to commit."
          fi
