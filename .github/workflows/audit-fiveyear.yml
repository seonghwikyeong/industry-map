name: Audit five-year history for 47 companies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_fiveyear_coverage.py'
      - 'timeseries-sec5y.json'
      - 'timeseries-twse5y.json'
      - '.github/workflows/audit-fiveyear.yml'

permissions:
  contents: write

concurrency:
  group: audit-fiveyear-history
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit 47 firms' actual number of sourced periods
        run: python scripts/check_fiveyear_coverage.py
      - name: Save public per-company coverage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeseries-coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish five-year audited industry-map company metric coverage"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
