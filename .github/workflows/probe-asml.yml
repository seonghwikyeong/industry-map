name: Probe ASML official five-year quarterly Excel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_asml_financials.py'
      - '.github/workflows/probe-asml.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python -u scripts/probe_asml_financials.py
