name: Check financial time-series provider

on:
  schedule:
    # Check keyless SEC statement provider daily. The website fetches on demand.
    - cron: '41 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'timeseries-ui.js'

permissions:
  contents: read

concurrency:
  group: ai-industry-timeseries-provider-check
  cancel-in-progress: false

jobs:
  check-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify SEC-derived statement API response and attribution
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://tgmcharts.com/api/v1/statements/MSFT/income-statement?period=quarterly&years=2'
          req = urllib.request.Request(url, headers={'User-Agent':'AIIndustryMap/5.0 (open-source site; GitHub Actions)','Accept':'application/json','Origin':'https://seonghwikyeong.github.io'})
          with urllib.request.urlopen(req, timeout=25) as r:
              cors=r.headers.get('Access-Control-Allow-Origin')
              print('Browser CORS:', cors)
              if cors not in ('*','https://seonghwikyeong.github.io'):
                  raise SystemExit('Provider lacks browser CORS permission')
              data=json.load(r)
          print('Provider:', data.get('source'))
          print('Ticker:', data.get('symbol'))
          print('Status:', data.get('status','available'))
          print('Quarterly rows:', len(data.get('rows') or []))
          if not data.get('rows'):
              raise SystemExit('Provider returned no historical rows; check coverage or availability')
          sample=data['rows'][0]
          print('Newest period:', sample.get('periodEnd'))
          print('Available concepts:', list(sample.get('metrics') or {})[:8])
          PY
