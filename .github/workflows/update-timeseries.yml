name: Update financial time series

on:
  schedule:
    # Daily 05:41 UTC / 14:41 Korea; SEC historical series refresh
    - cron: '41 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'timeseries-ui.js'
      - 'scripts/update_timeseries.py'

permissions:
  contents: write

concurrency:
  group: ai-industry-timeseries
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect historical SEC XBRL financial facts
        run: python scripts/update_timeseries.py

      - name: Commit historical data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeseries.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh SEC quarterly historical financials"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No data updates"
          fi
