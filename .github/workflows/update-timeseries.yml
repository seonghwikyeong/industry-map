name: Verify historical financial cache and optional live API
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'timeseries-ui.js'
      - 'timeseries-sec5y.json'
      - '.github/workflows/update-timeseries.yml'

permissions:
  contents: read

concurrency:
  group: ai-industry-timeseries-provider-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify cached 5-year SEC histories and optional external endpoint
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, json, os, urllib.error, urllib.request
          with open('timeseries-sec5y.json',encoding='utf-8') as f: data=json.load(f)
          companies=data.get('companies') or {}
          points=sum(len(series.get('points') or []) for m in companies.values() for series in m.values())
          assert len(companies)>=30 and points>=15000, 'Stored SEC financial histories insufficient'
          date=data.get('generated_at') or 'unknown'
          print(f'Cached five-year financials: {len(companies)} companies, {points} points; generated={date}')
          url='https://tgmcharts.com/api/v1/statements/MSFT/income-statement?period=quarterly&years=2'
          req=urllib.request.Request(url,headers={
              'User-Agent':'AIIndustryMap/6.0 (open-source GitHub Pages)',
              'Accept':'application/json','Origin':'https://seonghwikyeong.github.io'})
          status='unavailable'
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  provider=json.load(r)
                  assert provider.get('rows'),'Live provider returned no financial history'
                  cors=r.headers.get('Access-Control-Allow-Origin')
                  assert cors in ('*','https://seonghwikyeong.github.io'), 'Live provider does not allow site CORS'
                  status='available'
          except urllib.error.HTTPError as e:
              if e.code in (401,403):
                  status=f'restricted HTTP {e.code}; stored 5-year histories remain available'
                  print('::warning::Live history API now requires authentication, using published static history.')
              else: raise
          print('Live history provider:',status)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Historical data status\n')
              f.write(f'- Cached SEC companies: {len(companies)}\n')
              f.write(f'- Cached data points: {points}\n')
              f.write(f'- Cached last generation: {date}\n')
              f.write(f'- Optional live provider: {status}\n')
          PY
